# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"        # covers pnpm when pnpm-lock.yaml exists
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
