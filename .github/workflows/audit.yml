name: Universal Health & Security Audit Gate (2026 Baseline)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-supply-chain:
    name: 🔒 Security & Supply Chain (OWASP 2025 / SLSA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Audit (Forced Official Registry)
        run: pnpm audit --registry=https://registry.npmjs.org/ --audit-level=high

      - name: Generate CycloneDX 1.6 SBOM
        run: node scripts/generate-sbom.mjs

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build-artifacts/bom.json
          retention-days: 14

  quality-and-build:
    name: ⚙️ Stability & Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: pnpm tsc --noEmit

      - name: ESLint Flat Config Review
        run: pnpm eslint .

      - name: Deterministic Next.js Build
        run: pnpm build

  contract-smoke-test:
    name: 🔗 Integration & Contract Smoke Test
    needs: quality-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js App
        run: pnpm build

      - name: Start Server & Smoke Test Route Contract
        run: |
          pnpm start &
          npx wait-on http://localhost:3000
          curl -f -s http://localhost:3000/api/github?repo=vercel/next.js > /dev/null || exit 1
