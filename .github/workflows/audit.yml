name: RepoScope Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly security re-scan (catches new advisories)

jobs:
  security:
    name: Security — Dependency & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # Stability: deterministic install
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high    # braces (dev-only) currently passes at high threshold
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-review:
    name: Code Review — Lint & Type Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  stability:
    name: Stability — Deterministic Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify build artifacts exist
        run: |
          test -d .next || { echo "::error::Build produced no .next output"; exit 1; }
          echo "Build output verified."

  integration:
    name: Integration — Runtime & API Contract Smoke Test
    runs-on: ubuntu-latest
    needs: [security, code-review, stability]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Boot server & smoke-test API contract
        run: |
          pnpm start &
          SERVER_PID=$!
          # Wait up to 30s for readiness (stability: no blind sleep)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          # /api/github must return a valid HTTP response (contract check)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/github)
          echo "GET /api/github -> $STATUS"
          case "$STATUS" in
            200|401|429) echo "API route responding with a defined contract ✓" ;;
            000) echo "::error::API route unreachable — integration failure"; exit 1 ;;
            *)   echo "::warning::Unexpected status $STATUS — review error handling" ;;
          esac
          kill $SERVER_PID
