version: "1.0"
profile: iiot
rules:
  - id: iiot-001
    status: draft
    profile: iiot
    severity: critical
    title: "Modbus exception handling missing"
    rationale: >
      Unhandled Modbus exceptions cause silent data loss and unplanned downtime
      in production PLC-connected systems. IEC 62443 requires explicit fault
      containment at every protocol boundary.
    checks:
      - pattern: "ModbusIOException|ModbusException"
        in: "**/*.py"
        mode: must_exist
        message: "No Modbus exception handling found in Python sources."
      - pattern: "mock.*modbus|modbus.*mock|ModbusSimulatorServer"
        in: "**/mock/**/*modbus*"
        mode: must_exist
        message: "No Modbus simulator/mock found for offline testing."
    fix: |
      Wrap every Modbus call in try/except ModbusIOException and provide a
      ModbusSimulatorServer fixture for unit tests so CI passes without hardware.

      Example:
        from pymodbus.exceptions import ModbusIOException
        try:
            result = client.read_holding_registers(0, 10)
        except ModbusIOException as exc:
            logger.error("Modbus read failed: %s", exc)
            raise
    references:
      - book: "Industrial Network Security"
        section: "Chapter 4 – Protocol-level fault containment"
      - book: "PLC Controls with Structured Text"
        section: "Chapter 7 – Exception handling in cyclic tasks"
      - standard: "IEC 62443-3-3 SR 3.5"

  - id: iiot-002
    profile: iiot
    severity: error
    title: "Hardcoded PLC IP address detected"
    rationale: >
      Hardcoded private IP addresses couple code to a single physical network
      segment and expose internal topology in version control. IEC 62443
      requires network-segment isolation and configuration externalisation.
    checks:
      - pattern: "192\\.168\\.|10\\.0\\.|172\\.(1[6-9]|2[0-9]|3[01])\\."
        in: "**/*.py"
        mode: must_not_exist
        message: "Hardcoded private IP found – move PLC_HOST to environment variable."
    fix: |
      Replace the literal IP with an environment variable:
        import os
        PLC_HOST = os.environ["PLC_HOST"]  # e.g. 192.168.1.10
      Store the real value in .env (git-ignored) and document it in .env.example.
    references:
      - book: "Practical Industrial Data Networks"
        section: "Chapter 2 – Configuration management for field devices"
      - standard: "IEC 62443-2-1 SP.03.02"

  - id: iiot-003
    status: draft
    profile: iiot
    severity: warning
    title: "Python dependencies not pinned"
    rationale: >
      Unpinned dependencies allow silent upgrades that can break fieldbus
      driver behaviour between deployments.
    checks:
      - pattern: "requirements.*\\.txt"
        in: "."
        mode: must_exist
        message: "No requirements*.txt found."
      - pattern: "==\\d"
        in: "requirements*.txt"
        mode: must_exist
        message: "Dependencies appear unpinned – use == specifiers."
    fix: |
      Pin every runtime dependency:
        pip freeze > requirements.txt
      or manually:
        pymodbus==3.6.3
        opcua==0.98.13
    references:
      - book: "Automating Manufacturing Systems with PLCs"
        section: "Appendix B – Reproducible Python environments"

  - id: iiot-004
    profile: iiot
    severity: critical
    title: "LOTO / safety-procedure documentation missing"
    rationale: >
      Repositories controlling physical machinery must ship lockout–tagout
      documentation alongside the code so maintenance teams can safely
      de-energise equipment before any software change is applied.
    checks:
      - pattern: "loto|lockout|LOTO|LOCKOUT"
        in: "docs/safety/**,LOCKOUT*.md,SAFETY.md,docs/loto/**"
        mode: must_exist
        message: "No LOTO / lockout-tagout documentation found."
    fix: |
      Create docs/safety/loto.md referencing your site-level LOTO procedure
      and link it from README.md under a Safety section.
    references:
      - book: "Industrial Network Security"
        section: "Chapter 9 – Physical security and maintenance windows"
      - standard: "NFPA 70E Article 120"

  - id: iiot-005
    profile: iiot
    severity: error
    title: "Network topology / zone diagram missing"
    rationale: >
      IEC 62443 zone-and-conduit models require an up-to-date topology diagram
      so that security assessments and incident response can correctly scope
      the industrial network.
    checks:
      - pattern: "topology|network"
        in: "docs/network/**,docs/architecture/network*,**/*topology*.yaml,**/*topology*.yml,**/*topology*.md,**/*topology*.d2"
        mode: must_exist
        message: "No network topology diagram or document found."
    fix: |
      Add docs/network/topology.md (or topology.d2) documenting:
        - Control network segment (PLC subnet)
        - SCADA / HMI segment
        - DMZ / historian segment
        - Conduits and allowed protocols between zones
    references:
      - book: "Industrial Network Security"
        section: "Chapter 6 – Zone and conduit modelling"
      - standard: "IEC 62443-3-2 ZCR 1"

  - id: iiot-006
    profile: iiot
    severity: warning
    title: "PLC/SCADA source changes not tracked in CHANGELOG"
    rationale: >
      Changes to ladder logic, structured text, or SCADA screens must be
      traceable to a ticket and a deployment window to satisfy change-management
      requirements in regulated industries.
    checks:
      - pattern: "\\.(st|scl|lad|fbd|sfc)$"
        in: "plc/**,scada/**"
        mode: must_exist
        message: "No PLC/SCADA source files found under plc/ or scada/."
      - pattern: "CHANGELOG"
        in: "CHANGELOG*,docs/CHANGELOG*"
        mode: must_exist
        message: "No CHANGELOG found for PLC/SCADA change tracking."
    fix: |
      1. Store structured text / ladder sources under plc/ or scada/.
      2. Add a CHANGELOG.md entry for every release, referencing the ticket ID.
    references:
      - book: "Industrial Network Security"
        section: "Chapter 11 – Change and patch management"

  - id: iiot-007
    profile: iiot
    severity: error
    title: "Hardcoded serial port or Modbus TCP port"
    rationale: >
      Hardcoded COM ports and :502 addresses prevent multi-environment
      deployments and leak hardware topology into version control.
    checks:
      - pattern: "COM[1-9]|/dev/ttyUSB|/dev/ttyACM|:502"
        in: "**/*.py"
        mode: must_not_exist
        message: "Hardcoded serial/TCP port found – move to PLC_PORT env var."
    fix: |
      Replace literal ports with an environment variable:
        PLC_PORT = int(os.environ.get("PLC_PORT", "502"))
    references:
      - book: "Practical Industrial Data Networks"
        section: "Chapter 3 – Serial and TCP transport configuration"

  - id: iiot-008
    profile: iiot
    severity: warning
    title: "No Modbus / fieldbus mock infrastructure"
    rationale: >
      Tests that require live hardware are not runnable in CI. A mock or
      simulator layer decouples logic tests from physical device availability.
    checks:
      - pattern: "modbus|Modbus"
        in: "tests/**/*modbus*,__mocks__/**,conftest.py,mock_server.py"
        mode: must_exist
        message: "No Modbus mock or simulator infrastructure found."
    fix: |
      Add a conftest.py fixture using pymodbus SimulatorServer or a manual
      mock that returns realistic register maps for your device profile.
    references:
      - book: "Automating Manufacturing Systems with PLCs"
        section: "Chapter 12 – Software-in-the-loop testing"

  - id: iiot-009
    profile: iiot
    severity: warning
    title: "Protocol client timeout not set"
    rationale: >
      Without explicit timeouts, a stalled PLC or network partition causes
      the application to block indefinitely, preventing watchdog recovery.
    checks:
      - pattern: "timeout\\s*[=:]"
        in: "**/*.py"
        mode: must_exist
        message: "No explicit timeout found in Python sources."
    fix: |
      Pass a timeout to every protocol client:
        ModbusTcpClient(host, timeout=3)
        asyncio.wait_for(coro, timeout=5.0)
    references:
      - book: "Industrial Network Security"
        section: "Chapter 5 – Resilience and watchdog patterns"

  - id: iiot-hw-001
    status: spec-only
    profile: iiot
    severity: warning
    title: "Hardware-in-the-loop test harness absent"
    rationale: >
      HIL testing validates firmware and driver behaviour against a physical
      or emulated hardware target before production deployment. Without it,
      integration defects surface only on the factory floor.
    checks:
      - pattern: "hil|hardware.in.the.loop|HIL"
        in: "docs/**,tests/**,README*"
        mode: must_exist
        message: "No HIL test harness documentation or test suite found."
    fix: |
      Document your HIL setup in docs/testing/hil.md and add a test suite
      or CI job that targets the emulated hardware target. Link from README.md.
    references:
      - book: "Automating Manufacturing Systems with PLCs"
        section: "Chapter 13 – Hardware-in-the-loop validation"
      - standard: "IEC 61508-6 Annex B"
