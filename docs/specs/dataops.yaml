version: "1.0"
profile: "dataops"
description: "Enterprise DataOps and Analytics Engineering static repository audit rules suite."

rules:
  - id: "dataops-001"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "Dependency lockfile missing"
    rationale: >
      Without a lockfile or pinned requirements file, environment drift can break
      reproducibility and cause silent pipeline failures across environments.
    checks:
      - type: "file_exists"
        path_glob: "{poetry.lock,Pipfile.lock,conda-lock.yml,requirements.txt}"
        error_when: "file_absent"
        message: "No dependency lockfile or requirements file found."
    fix: |
      Generate and commit a lockfile:
      - poetry lock
      - pipenv lock
      - conda-lock -f environment.yml
      Or commit a pinned requirements.txt.
    references:
      - book: "Fundamentals of Data Engineering: Plan and Build Robust Data Systems"
        concept: "reproducible-data-pipelines"

  - id: "dataops-sec-001"
    profile: "dataops"
    severity: "critical"
    status: "draft"
    title: "Hardcoded secret or credential detected"
    rationale: >
      Committed secrets create credential leakage risk and break environment portability.
    checks:
      - type: "pattern_match"
        file_glob: "**/*.{py,sql,yaml,yml,sh,json,env,toml,ini}"
        pattern: '(?i)(password|passwd|pwd|secret|api_key|apikey|access_token|private_key)\s*[:=]\s*["''][^"'']{8,}'
        must_exist: false
        error_when: "pattern_present"
        message: "Hardcoded secret or credential detected. Use environment variables or a secret store."
    fix: |
      Replace literal secrets with environment variables or secret-store references.
      Rotate any exposed credentials and purge them from git history if needed.
    references:
      - book: "Practical DataOps"
        concept: "security-governance"
      - book: "Fundamentals of Data Engineering: Plan and Build Robust Data Systems"
        concept: "security-undercurrent"

  - id: "dataops-sec-002"
    profile: "dataops"
    severity: "critical"
    status: "draft"
    title: "Embedded database password in connection URI"
    rationale: >
      Connection strings with inline passwords leak credentials and prevent secure
      environment promotion.
    checks:
      - type: "pattern_match"
        file_glob: "**/*.{py,yaml,yml,json,toml,ini}"
        pattern: '(?i)(postgres|mysql|snowflake|redshift|bigquery|clickhouse)://[^:@/\s]+:[^@\s]+@'
        must_exist: false
        error_when: "pattern_present"
        message: "Unencrypted database connection string with embedded password detected."
    fix: |
      Use secret injection, environment variables, or a managed connection broker.
      Never embed usernames/passwords directly in connection URIs.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "system-reliability-and-security"

  - id: "dataops-infra-001"
    profile: "dataops"
    severity: "warning"
    status: "draft"
    title: "Infrastructure as Code missing"
    rationale: >
      Data platform infrastructure should be version-controlled and reproducible.
      Manual environment setup creates drift and reduces auditability.
    checks:
      - type: "file_exists"
        path_glob: "{terraform/**/*.tf,cloudformation/**/*.yaml,pulumi/**/*.py,k8s/**/*.yaml}"
        error_when: "file_absent"
        message: "No Infrastructure as Code declaration found."
    fix: |
      Add Terraform, CloudFormation, Pulumi, or Kubernetes manifests for platform provisioning.
    references:
      - book: "Fundamentals of Data Engineering: Plan and Build Robust Data Systems"
        concept: "data-architecture-undercurrents"

  - id: "dataops-dbt-001"
    profile: "dataops"
    severity: "critical"
    status: "draft"
    title: "Hardcoded relation string in dbt model"
    rationale: >
      Hardcoded database/schema/table references bypass dbt lineage and break
      environment promotion.
    checks:
      - type: "pattern_match"
        file_glob: "models/**/*.sql"
        pattern: '(?i)\b(from|join)\s+[`''"]?[a-z0-9_]+\.[a-z0-9_]+\.[a-z0-9_]+[`''"]?'
        must_exist: false
        error_when: "pattern_present"
        message: "Hardcoded relation string detected. Use ref() or source()."
    fix: |
      Replace literal relations with {{ ref('model_name') }} or
      {{ source('source_name', 'table_name') }}.
    references:
      - book: "Analytics Engineering with SQL and dbt"
        concept: "model-referencing"

  - id: "dataops-dbt-002"
    profile: "dataops"
    severity: "critical"
    status: "draft"
    title: "dbt project manifest missing"
    rationale: >
      A dbt project root manifest is required for reproducible model resolution and
      project-aware compilation.
    checks:
      - type: "file_exists"
        path_glob: "dbt_project.yml"
        error_when: "file_absent"
        message: "dbt_project.yml is missing from repository root."
    fix: |
      Add dbt_project.yml at the repository root.
    references:
      - book: "Analytics Engineering with SQL and dbt"
        concept: "dbt-project-structure"

  - id: "dataops-dbt-003"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "dbt models directory missing"
    rationale: >
      Analytics engineering repositories using dbt should contain a models directory
      for transformed data assets.
    checks:
      - type: "file_exists"
        path_glob: "models/**/*.sql"
        error_when: "file_absent"
        message: "models/ directory is missing from dbt project."
    fix: |
      Create a models/ directory and add dbt SQL models.
    references:
      - book: "Analytics Engineering with SQL and dbt"
        concept: "modular-data-modeling"

  - id: "dataops-dbt-004"
    profile: "dataops"
    severity: "warning"
    status: "draft"
    title: "dbt packages manifest missing"
    rationale: >
      External dbt packages should be declared explicitly to avoid implicit dependency drift.
    checks:
      - type: "file_exists"
        path_glob: "packages.yml"
        error_when: "file_absent"
        message: "packages.yml manifest is missing."
    fix: |
      Add packages.yml if the project consumes external dbt packages.
    references:
      - book: "Analytics Engineering with SQL and dbt"
        concept: "dbt-packages-and-macros"

  - id: "dataops-quality-001"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "Data quality test configuration missing"
    rationale: >
      Repositories lacking automated data quality test configurations risk silent
      data corruption in production pipelines.
    checks:
      - type: "file_exists"
        path_glob: "{models/**/_*.yml,great_expectations.yml,soda.yml,tests/**/*.sql}"
        error_when: "file_absent"
        message: "No data quality test configuration or assertion framework detected."
    fix: |
      Add dbt tests, Great Expectations configs, Soda checks, or equivalent assertion files.
    references:
      - book: "Data Quality Fundamentals: A Practitioner's Guide to Building Trustworthy Data Pipelines"
        concept: "automated-quality-gates"
      - book: "Practical DataOps"
        concept: "agile-quality-assurance"

  - id: "dataops-runbook-001"
    profile: "dataops"
    severity: "warning"
    status: "draft"
    title: "Version-controlled incident runbook missing"
    rationale: >
      Standardized incident response documentation reduces Time to Resolution and
      eliminates dependence on tribal knowledge during data outages.
    checks:
      - type: "file_exists"
        path_glob: "{RUNBOOK.md,docs/RUNBOOK.md,docs/runbooks/*.md,docs/incidents/*.md}"
        error_when: "file_absent"
        message: "Incident response runbook missing."
    fix: |
      Add RUNBOOK.md or docs/runbooks/*.md describing detection, triage, escalation,
      and postmortem workflow.
    references:
      - book: "Data Quality Fundamentals: A Practitioner's Guide to Building Trustworthy Data Pipelines"
        concept: "data-incident-management"

  - id: "dataops-atwal-002"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "Automated test suite missing"
    rationale: >
      Data software should include version-controlled automated tests to catch
      regressions before deployment.
    checks:
      - type: "file_exists"
        path_glob: "{tests/**,test/**,pytest.ini}"
        error_when: "file_absent"
        message: "Automated testing directory missing."
    fix: |
      Add a tests/ directory with unit/integration tests and a test runner configuration.
    references:
      - book: "Practical DataOps"
        concept: "automated-testing-and-ci"

  - id: "dataops-fde-001"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "Pipeline orchestration code missing"
    rationale: >
      Workflows should be declared as code to ensure reproducibility, reviewability,
      and deterministic execution.
    checks:
      - type: "file_exists"
        path_glob: "{dags/**/*.py,orchestration/**/*.py,workflows/**/*.yaml,dagster_app/**/*.py}"
        error_when: "file_absent"
        message: "Pipeline orchestration code missing."
    fix: |
      Add Airflow DAGs, Dagster assets, Prefect flows, or equivalent orchestration definitions.
    references:
      - book: "Fundamentals of Data Engineering: Plan and Build Robust Data Systems"
        concept: "pipelines-as-code"

  - id: "dataops-atwal-003"
    profile: "dataops"
    severity: "warning"
    status: "active"
    title: "Dependency lockfile missing"
    rationale: >
      Dependency lockfiles prevent environment drift and broken builds caused by
      unpinned transitive dependencies.
    checks:
      - type: "file_exists"
        path_glob: "{requirements.txt,Pipfile.lock,poetry.lock,conda-lock.yml}"
        error_when: "file_absent"
        message: "Dependency lockfile missing."
    fix: |
      Commit a lockfile generated by Poetry, Pipenv, conda-lock, or pinned requirements.txt.
    references:
      - book: "Practical DataOps"
        concept: "environment-reproducibility"

  - id: "dataops-kleppmann-002"
    profile: "dataops"
    severity: "error"
    status: "active"
    title: "Streaming schema IDL missing"
    rationale: >
      Event-driven pipelines need explicit schema definitions to prevent unannounced
      breaking changes and support schema evolution.
    checks:
      - type: "file_exists"
        path_glob: "{schemas/**/*.proto,schemas/**/*.avsc,schemas/**/*.thrift,events/**/*.proto}"
        error_when: "file_absent"
        message: "Streaming schema IDL definitions missing."
    fix: |
      Add Avro, Protobuf, or Thrift schema files for event streams.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "schema-evolution-and-encoding"

  - id: "dataops-kleppmann-003"
    profile: "dataops"
    severity: "warning"
    status: "active"
    title: "Database migration directory missing"
    rationale: >
      Schema evolution should be version-controlled through migration tooling to
      enable safe, repeatable deployments.
    checks:
      - type: "file_exists"
        path_glob: "{migrations/**,flyway/**,alembic/**,db/migrate/**}"
        error_when: "file_absent"
        message: "Database schema migration directory missing."
    fix: |
      Add migration scripts using Flyway, Alembic, dbmate, or equivalent tooling.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "schema-evolution"

  - id: "dataops-kimball-001"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "Fact table joined on natural key instead of surrogate key"
    rationale: >
      Dimensional models should join facts to dimensions using surrogate keys to
      preserve history, stability, and performance.
    checks:
      - type: "pattern_match"
        file_glob: "models/marts/facts/**/*.sql"
        pattern: '(?i)\bjoin\b\s+\w+\s+\bon\b\s+[\w.]+\.(id|code|natural_key)\s*='
        must_exist: false
        error_when: "pattern_present"
        message: "Fact table model joins on natural operational key. Use surrogate keys (_sk)."
    fix: |
      Replace natural-key joins with surrogate-key joins, for example customer_sk, product_sk.
    references:
      - book: "The Data Warehouse Toolkit"
        concept: "surrogate-keys"

  - id: "dataops-kimball-002"
    profile: "dataops"
    severity: "error"
    status: "draft"
    title: "SCD Type 2 dimension missing effective date tracking"
    rationale: >
      Slowly Changing Dimension Type 2 models require effective dating and current
      state indicators to preserve historical accuracy.
    checks:
      - type: "pattern_match"
        file_glob: "models/marts/dimensions/**/*.sql"
        pattern: '(?i)\b(effective_at|valid_from|dbt_valid_from|dbt_valid_to|is_current)\b'
        must_exist: true
        error_when: "pattern_absent"
        message: "SCD Type 2 dimension model lacks required effective date tracking columns."
    fix: |
      Add effective_start, effective_end, dbt_valid_from, dbt_valid_to, or is_current fields.
    references:
      - book: "The Data Warehouse Toolkit"
        concept: "slowly-changing-dimensions"

  - id: "dataops-kimball-003"
    profile: "dataops"
    severity: "warning"
    status: "draft"
    title: "Enterprise bus matrix missing"
    rationale: >
      A bus matrix documents conformed dimensions across business processes and
      prevents fragmented warehouse design.
    checks:
      - type: "file_exists"
        path_glob: "{docs/bus_matrix.md,docs/architecture/bus_matrix.md,bus_matrix.csv}"
        error_when: "file_absent"
        message: "Enterprise Bus Matrix missing."
    fix: |
      Add a bus matrix document mapping business processes to shared dimensions.
    references:
      - book: "The Data Warehouse Toolkit"
        concept: "bus-matrix"

  - id: "dataops-scale-001"
    profile: "dataops"
    severity: "critical"
    status: "draft"
    title: "Data product manifest missing"
    rationale: >
      Domain-oriented data platforms require explicit data product manifests to
      define ownership, SLAs, contracts, and discoverability.
    checks:
      - type: "file_exists"
        path_glob: "{data-product.yml,data-product.yaml}"
        error_when: "file_absent"
        message: "data-product.yml specification missing."
    fix: |
      Add a data-product.yml manifest describing ownership, SLAs, schema, and consumers.
    references:
      - book: "Data Management at Scale"
        concept: "data-product-manifest"

  - id: "dataops-scale-003"
    profile: "dataops"
    severity: "warning"
    status: "draft"
    title: "Data contract definitions missing"
    rationale: >
      Explicit data contracts reduce breaking changes between producers and consumers
      in federated data architectures.
    checks:
      - type: "file_exists"
        path_glob: "{contracts/**,schemas/contracts/**,docs/contracts/**}"
        error_when: "file_absent"
        message: "Data contracts directory missing."
    fix: |
      Add contract definitions for domain interfaces, including schema, semantics,
      and compatibility rules.
    references:
      - book: "Data Management at Scale"
        concept: "data-contracts"

  - id: "dataops-004"
    profile: "dataops"
    severity: "error"
    status: "active"
    title: "Unmanaged large or raw data files tracked in Git"
    rationale: >
      Raw tabular and binary datasets (CSV, Parquet, Excel, SQLite, etc.) tracked
      directly in Git bloat the repository, slow CI/CD, and cannot be reproduced
      from source. Version-control them with DVC or Git LFS, or move them to a
      data lake.
    checks:
      - type: "pattern_match"
        pattern: '\.(csv|parquet|feather|xlsx|xls|sqlite|db|h5|pkl|npy|npz)$'
        must_exist: false
        file_glob: "**/*"
        error_when: "pattern_present"
        message: "Raw data file tracked in Git without DVC or Git LFS — move to a data lake or version with DVC."
    fix: |
      Track large datasets with DVC (https://dvc.org) or Git LFS, and add raw
      data directories to .gitignore. Commit only pointers, not blobs.
    references:
      - book: "Practical DataOps"
        concept: "data-versioning"
      - book: "Designing Data-Intensive Applications"
        concept: "data-reproducibility"

  - id: "dataops-006"
    profile: "dataops"
    severity: "warning"
    status: "active"
    title: "Jupyter notebook hygiene issues detected"
    rationale: >
      Committed notebooks with heavy outputs and out-of-order execution counts
      bloat repositories and obscure intent. Notebooks should be cleaned before
      commit using nbstripout or nbconvert.
    checks:
      - type: "pattern_match"
        pattern: '"outputs"\s*:\s*\[[^\]]{1000,}'
        must_exist: false
        file_glob: "**/*.ipynb"
        error_when: "pattern_present"
        message: "Notebook contains heavy outputs — clear before commit with nbstripout."
    fix: |
      Add nbstripout to pre-commit hooks, or run
      `jupyter nbconvert --clear-output --inplace *.ipynb` before commit.
    references:
      - book: "Practical DataOps"
        concept: "notebook-hygiene"

  # =================================================================
  # SEMANTIC EVALUATION RULES — Layer 3
  # These read file contents and score architectural quality
  # =================================================================

  - id: "dataops-runbook-sem-001"
    profile: "dataops"
    severity: "error"
    title: "Runbook lacks actionable triage structure"
    rationale: >
      A runbook must contain detection criteria, triage commands, escalation
      path, and postmortem template. Mere existence of the file is not enough.
    checks:
      - type: "semantic_eval"
        file_glob: "{RUNBOOK.md,docs/RUNBOOK.md,docs/runbooks/*.md}"
        error_when: "semantic_score_below_threshold"
        threshold: 0.7
        evaluation_prompt: |
          Evaluate this runbook against 5 criteria. A criterion is MET only if the
          document contains specific, actionable content — generic advice does not
          count.

          1. Detection criteria: named alerts (e.g., "DataPipelineStale") or
             specific metric thresholds. "Check the logs" does NOT count.
          2. Triage steps: numbered shell commands. "Look at the UI" does NOT count.
          3. Escalation path: named roles with contact methods and time SLAs.
             "Page the on-call" does NOT count.
          4. Postmortem template: a section list (timeline, root cause, impact,
             action items). "Write a summary" does NOT count.
          5. Runbook-specific commands: actual commands for THIS service. Generic
             advice does NOT count.

          Score bands (mechanical — do not deviate):

          BEFORE scoring, count section headings in the document.
          A "section heading" is a line beginning with `## ` or `### `.
          A lone `# Title` line does NOT count.

          If ZERO section headings exist (## or ###), the score MUST be ≤ 0.20
          — regardless of how sensible the prose is. A prose-only document is
          not a runbook; it is a placeholder.

          If headings exist, use this table:
          - 0.21–0.30: headings exist for ≤ 2 criteria only
          - 0.31–0.50: headings exist for ≥ 3 criteria, content generic
          - 0.51–0.75: some sections specific, 1–2 criteria still generic
          - 0.76–0.85: all criteria specific, one minor gap
          - 0.86–1.00: all criteria specific and complete

          Respond with valid JSON only:
          {"score": number, "missing": [criterion names from the list above], "reasoning": string}.
          The missing array must contain ONLY the criterion names. Never include
          "score", "missing", or "reasoning" as items in the missing array.
        message: "Runbook lacks actionable triage structure"
    fix: |
      Add explicit escalation contacts with phone/on-call rotation.
      Add numbered triage commands (not prose).
      Include postmortem template section with timeline, root cause, action items.
    references:
      - book: "Site Reliability Engineering: How Google Runs Production Systems"
        concept: "on-call-and-incident-management"

  - id: "dataops-data-product-sem-001"
    profile: "dataops"
    severity: "critical"
    title: "Data product manifest lacks governance essentials"
    rationale: >
      A data product manifest must declare ownership, SLAs, schema version,
      and consumers. An empty or minimal manifest violates data mesh principles.
    checks:
      - type: "semantic_eval"
        file_glob: "{data-product.yml,data-product.yaml,docs/data-product*.md}"
        error_when: "semantic_score_below_threshold"
        threshold: 0.7
        evaluation_prompt: |
          You are a data mesh architect reviewing a data product manifest.

          Evaluate each of the 5 criteria as PASS or FAIL. Do NOT use holistic
          judgement — determine each criterion independently.

          Criterion 1 — Owner:
            PASS if the manifest declares a named owning team OR a named
                 individual. A team name alone (e.g., team: data-platform)
                 counts as PASS. Contact information (email, Slack channel,
                 on-call rotation) is preferred but not required for PASS.
            FAIL if the manifest has no owner section, or if owner is a
                 placeholder like TBD, team-x, or unknown.

          Criterion 2 — SLA:
            PASS if the manifest declares freshness, latency, or availability
                 targets.
            FAIL if the manifest has no SLA section.

          Criterion 3 — Schema version:
            PASS if the manifest declares a schema version number, a schema
                 registry link, or a versioned schema URL.
            FAIL if the manifest has no schema_version field.

          Criterion 4 — Consumers:
            PASS if the manifest lists at least 3 named downstream consumers.
            FAIL if the manifest lists fewer than 3 consumers. A consumers
                 list with 0, 1, or 2 entries = FAIL.

          Criterion 5 — Quality gates:
            PASS if the manifest declares quality checks, DQ metrics, or a
                 link to a quality framework.
            FAIL if the manifest has no quality section.

          ── REASONING FORMAT (mandatory) ────────────────────────────────

          The reasoning field MUST be a SINGLE-LINE string containing exactly
          5 numbered verdicts separated by the pipe character. Use this exact
          shape, with no line breaks and no wrapping quotation marks:

            1. owner: PASS or FAIL — short reason | 2. sla: PASS or FAIL — short reason | 3. schema_version: PASS or FAIL — short reason | 4. consumers: PASS or FAIL — short reason | 5. quality: PASS or FAIL — short reason

          Two absolute rules for the reasoning string value:
            - NO literal newline characters. Everything on one line.
            - NO double-quote characters anywhere inside the reasoning value.
              To refer to a field name or value, write it bare without quotes.

          A response whose reasoning does not fit on one line, or that
          contains a double-quote character inside the reasoning string,
          is a hard failure and will be rejected.

          ── SCORING AND MISSING[] (mechanical) ──────────────────────────

          AFTER writing the 5 verdicts in reasoning:
            1. Count how many verdicts are PASS (call it N_pass).
            2. N_fail equals 5 minus N_pass.
            3. The missing array MUST contain exactly N_fail entries, one per
               FAIL verdict. No more, no fewer.
            4. The score MUST be the midpoint value for N_pass from this table:

                 - 5 PASS: score 0.92
                 - 4 PASS: score 0.72
                 - 3 PASS: score 0.52
                 - 2 PASS: score 0.32
                 - 1 PASS: score 0.10
                 - 0 PASS: score 0.05

          CONSISTENCY CHECK: before emitting, verify that the length of the
          missing array equals N_fail, and score equals the midpoint for
          N_pass. If both are not true, redo the analysis.

          Respond with valid JSON only. The JSON object has exactly three keys:
          score (number), missing (array of strings), reasoning (single-line string).
        message: "Data product manifest lacks governance essentials"
    fix: |
      Add owner contact, SLA targets, schema version, 3+ consumers, and quality gates.
    references:
      - book: "Data Management at Scale"
        concept: "data-product-manifest"

  - id: "dataops-kimball-sem-001"
    profile: "dataops"
    severity: "error"
    title: "Fact table uses natural key joins (Kimball violation)"
    rationale: >
      Kimball methodology requires fact tables to join dimensions via surrogate keys,
      not natural keys. Natural key joins break history tracking and performance.
    checks:
      - type: "semantic_eval"
        file_glob: "models/marts/facts/**/*.sql"
        error_when: "semantic_score_below_threshold"
        threshold: 0.6
        evaluation_prompt: |
          Evaluate this dbt fact-table model against the Kimball dimensional-modeling
          criteria. A "surrogate key" is a column whose name ends in _sk
          (customer_sk, product_sk, order_sk, date_sk). A "natural key" is a
          business identifier (customer_id, order_id, product_id, email, SSN).
          An _sk column is NOT a natural key, even when it contains a business
          word like "customer" — the _sk suffix is definitionally a surrogate key.

          Score 0.0–1.0 based on these four criteria:
          1. Surrogate key joins: every JOIN ON clause references a column ending in _sk
             on BOTH sides.
          2. No natural key joins: no JOIN ON clause references customer_id, order_id,
             product_id, email, or similar business identifiers.
          3. Grain declared: a comment or docstring states the grain (e.g.,
             "Grain: one row per order line item").
          4. Additive facts: all measures are additive (quantity, amount, unit_price).
             A ratio such as amount/quantity (avg_price) is a defect.

          Score bands:
          - 0.00 if any JOIN uses a non-_sk column — the model is unsafe for aggregation
          - 0.30–0.50 if joins are correct but grain is undeclared or a ratio appears
          - 0.60–0.70 if joins and grain are correct but one minor defect remains
          - 0.85–1.00 only when all four criteria are satisfied

          Respond with valid JSON only:
          {"score": number, "missing": [criterion names from the list above], "reasoning": string}.
          The missing array must contain ONLY the criterion names. Never include
          "score", "missing", or "reasoning" as items in the missing array.
        message: "Fact table uses natural key joins (Kimball violation)"
    fix: |
      Replace natural-key joins with surrogate-key joins (customer_sk, product_sk).
    references:
      - book: "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling"
        concept: "surrogate-keys"

  - id: "dataops-kimball-ast-001"
    profile: "dataops"
    severity: "error"
    title: "Fact table uses natural key joins (Kimball violation)"
    rationale: >
      Kimball methodology requires fact tables to join dimensions via surrogate
      keys, not natural operational keys. Natural-key joins break history
      tracking, introduce implicit dependency on operational systems, and
      prevent conformed-dimension reuse across marts. This rule uses sqlglot
      AST analysis to detect the violation directly rather than relying on
      a regex heuristic.
    checks:
      - type: "structural_ast"
        parser: "sql"
        file_glob: "models/marts/facts/**/*.sql"
        message: "Fact table joins on natural key — use surrogate keys (_sk)."
    fix: |
      Replace natural-key joins with surrogate-key joins. For example, replace
      `LEFT JOIN dim_customers c ON o.customer_id = c.customer_id`
      with
      `LEFT JOIN dim_customers c ON o.customer_sk = c.customer_sk`.
    references:
      - book: "The Data Warehouse Toolkit: The Definitive Guide to Dimensional Modeling"
        concept: "surrogate-keys"

