# RepoScope DataOps Audit Specification
# Version: 3.0.7
# Last Updated: 2026-10-29
#
# Architecture Notes:
# - This file defines deterministic, structural, and semantic audit gates for data-intensive repositories.
# - Rules are evaluated in order within each profile. Cross-profile dependencies are handled by the orchestrator.
# - Structural AST rules (type: structural_ast) run before semantic rules and can authorize skips via depends_on_rule_id.
# - Semantic rules (type: semantic_eval) only emit findings when an LLM returns valid JSON reasoning below threshold.
# - Preflight regexes allow deterministic confirmation without LLM cost when patterns are unambiguous.
# - All rules must have status: active to be included in runtime specs.json generation.
# - Every check MUST carry `message`. The spec builder rejects checks without a static fallback string.
# - Composite checks that the engine cannot yet evaluate natively (conjunctive_check,
#   disjunctive_absence) are approximated with deterministic file_exists checks over the
#   relevant path set. The approximation fires when NO matching file exists anywhere,
#   which is the closest safe approximation the current engine can express. The native
#   composite upgrade remains tracked as a future improvement.
# - Rule IDs are stable contracts. Renaming an ID requires a coordinated update to any
#   TypeScript module that emits the same finding ID (parity constraint enforced in Week 1).
# - Every `concept:` value under `references:` is quoted. Bare scalars parse fine today but
#   fail silently the moment a future edit introduces a space or special character; the quoted
#   form is the documented convention and is enforced here for consistency.
#
# CHANGELOG 3.0.7 (2026-10-29):
#   - GROUNDING HARDENING for dataops-dim-ast-001 / dataops-dim-sem-001:
#     * Removed the `primary-vs-secondary-indexing` reference from
#       dataops-dim-ast-001. The rule detects natural-key vs surrogate-key
#       joins; `surrogate-keys` (Data Warehouse Toolkit) is the only
#       concept the finding actually cites. Secondary indexing was
#       unrelated ground truth and produced noisy citation coverage
#       without changing the finding semantics.
#     * Titles tightened to make the Kimball attribution explicit:
#       "(dimensional model violation)" -> "(Kimball violation)".
#     * Description / rationale / message text updated to name Kimball
#       dimensional modeling directly, so future readers do not have to
#       infer which modeling school the rule derives from.
#   - SCOPE CORRECTION for dataops-dim-sem-001:
#     * file_glob reverted from "**/*.sql" -> "models/**/*.sql". The wide
#       glob pulled in non-model SQL (test fixtures, ad-hoc scripts,
#       migration files) that the AST layer never inspects, producing
#       semantic findings outside the rule's intent. The AST rule keeps
#       its tight "models/marts/facts/**/*.sql" scope; the semantic rule
#       widens only to the models tree.
#   - Rule ID parity: no rename. dataops-dim-ast-001 / dataops-dim-sem-001
#     are the canonical IDs and already match the TypeScript finding ID
#     union and current test fixtures. (The legacy
#     `dataops-kimball-ast-001` / `dataops-kimball-sem-001` aliases remain
#     migration-only; do NOT reintroduce them here.)
#   - No severity changes. No structural check changes. No semantic
#     threshold changes.
#
# CHANGELOG 3.0.6 (2026-10-29):
#   - PARITY AUDIT: Ran the deterministic migration script that rewrites legacy aliases
#     (dataops-kimball-ast-001, dataops-kimball-sem-001, dataops-atwal-001..003,
#      dataops-kleppmann-001..003) to the canonical set. No matches were found in this
#     file — every active rule already carries a canonical ID. Migration is a documented
#     no-op against this spec.
#   - The three reported-but-ungrounded IDs (`dataops-atwal-003`,
#     `dataops-kleppmann-002`, `dataops-kleppmann-003`) were located in
#     lib/dataops-audit.ts and rewritten there. See commit for that file.
#   - Orphan emitters `dataops-004` (data_leak) and `dataops-006` (notebook_hygiene)
#     remain in lib/dataops-audit.ts with no corresponding spec rule. They are now
#     surfaced explicitly in lib/types.ts as DataOpsOrphanFindingId and MUST be either
#     spec'd in a future YAML revision or removed from the audit module. Do not merge
#     new emitters of this shape.
#   - No rule IDs renamed in this file. No checks changed. No semantics changed.
#
# CHANGELOG 3.0.5 (2026-10-28):
#   - Migrated three previously-draft rules to active with proper `file_exists` structure:
#       * dataops-stream-001: `path_glob:` brace-expansion -> `paths:` list + `match_mode: any`
#       * dataops-migrate-001: same
#       * dataops-test-001: same
#     These were held back because the engine lacks native `conjunctive_check` /
#     `disjunctive_absence` support. The file-presence approximation is now live so the
#     rule IDs emit grounded findings instead of being silently inert. The composite
#     upgrade path (streaming-topic detection, "transformations present but no tests",
#     "no migration tooling anywhere") remains tracked.
#   - dataops-env-001 and dataops-env-002: added explicit `error_when: file_absent` to
#     match the `file_exists` contract already used by dataops-env-003.
#   - Rule ID audit: `dataops-atwal-003`, `dataops-kleppmann-002`, `dataops-kleppmann-003`
#     were again reported. Grep against this file confirms those IDs do not exist here and
#     no source content for them is available in this repository. They must originate from a
#     different branch or stale specs.json. They are intentionally NOT added to avoid
#     fabricating ungrounded rule content.
#     Verify with: python scripts/build_knowledge.py && grep -n "dataops-atwal-003" public/knowledge/specs.json
#   - No rule IDs renamed. Parity contract with TypeScript finding IDs preserved.
#
# CHANGELOG 3.0.4 (2026-10-28):
#   - Consistency hardening: every `concept:` value under `references:` is now quoted.
#     No rule IDs renamed. No checks changed. No semantics changed. This is a pure
#     formatting pass to match the documented reference convention and defend against
#     silent parse regressions in future edits.
#   - Rule ID audit: `dataops-atwal-003`, `dataops-kleppmann-002`, `dataops-kleppmann-003`
#     were reported as ungrounded active rules. Grep against this file confirms those
#     IDs do not exist here. Every active rule in this file already carries a populated
#     `references:` block. No grounding fix was required; the reported IDs originate
#     elsewhere (different branch, different iteration, or a stale specs.json).
#   - No rule IDs renamed. Parity contract with TypeScript finding IDs preserved.
#
# CHANGELOG 3.0.3 (2026-10-28):
#   - dataops-env-003: `pattern_match` + `scope` + `patterns` + `expect_present` migrated
#     to `file_exists` + `paths` + `match_mode: any` + `error_when: file_absent`.
#     This is a file-presence rule, not a content-regex rule; `pattern_match` was the
#     wrong engine primitive. npm test rejected the check because it requires `pattern`
#     plus a glob key on every `pattern_match`. Message semantics preserved exactly.
#   - No rule IDs renamed. Parity contract with TypeScript finding IDs preserved.
#
# CHANGELOG 3.0.2 (2026-10-28):
#   - Every rule now declares `profile: dataops` at rule level. The npm test
#     validates per-rule profile presence; the top-level `profile:` key alone
#     was insufficient and caused the test suite to fail.
#   - dataops-schema-001: `scope:` + `patterns:` (list) + `exclude_if_contains:`
#     migrated to `file_glob:` + `pattern:` (string) + `error_when: pattern_present`.
#     The composite exclusion logic is temporarily dropped because the current
#     engine does not support exclude_if_contains; it will be re-added when
#     composite checks land. The rule is now live instead of silently inert.
#   - dataops-obs-001: `scope:` + `patterns:` (list) + `min_matches_per_file:`
#     migrated to `file_glob:` + `pattern:` (string) + `error_when: pattern_absent`.
#     Semantics preserved: flag when no observability primitive appears anywhere.
#   - No rule IDs renamed. Parity contract with TypeScript finding IDs preserved.
#
# CHANGELOG 3.0.1 (2026-10-28):
#   - Confirmed dataops-dim-sem-001.file_glob is "**/*.sql" so the semantic fallback
#     sees every SQL fixture the AST layer scans. The previous "models/**/*.sql" scope
#     produced silent "no matching files" skips (semantic-runner skip notice).
#   - Confirmed depends_on_rule_id: dataops-dim-ast-001 and skip_if_structural_confirmed: true
#     are wired so AST confirmation short-circuits the LLM call.
#   - No rule IDs renamed. Parity contract with TypeScript finding IDs preserved.

profile: dataops
description: >
  Audits dbt/SQL/notebook repositories against modern data engineering standards including
  Kimball dimensional modeling integrity, schema evolution safety, reproducibility hygiene,
  and operational readiness. Draws from dimensional modeling methodology, distributed-systems
  design principles, and DataOps lifecycle frameworks.

rules:
  # ===========================================================================
  # DIMENSIONAL MODELING RULES (Option C: AST-Authoritative + Semantic Fallback)
  # ===========================================================================

  - id: dataops-dim-ast-001
    profile: dataops
    status: active
    severity: error
    title: Fact table uses natural key joins (Kimball violation)
    description: >
      Detects JOIN clauses in fact models that compare operational natural keys
      (customer_id, order_id, product_id, sku, email, ssn, tax_id, phone,
      account_number, invoice_number, user_id, national_id, passport_number)
      instead of surrogate keys ending in _sk, _key, _surrogate, _dim_key,
      or _hash.
    rationale: >
      Kimball dimensional modeling requires surrogate keys for stable
      referential integrity and performant joins. Natural-key joins couple
      business semantics to physical storage and make refactoring,
      partitioning, and slowly-changing-dimension handling fragile.
    fix: Replace natural-key joins with surrogate-key joins (customer_sk, order_sk, product_sk).
    references:
      - book: "The Data Warehouse Toolkit"
        concept: "surrogate-keys"
    checks:
      - type: structural_ast
        parser: sqlglot
        file_glob: "models/marts/facts/**/*.sql"
        max_checks: 20
        message: "Fact table joins on natural key(s). Use surrogate keys (_sk)."
        dialect_hints: ["snowflake", "bigquery", "postgres", "redshift", "databricks"]
        detection_patterns:
          natural_keys:
            - "^customer_id$"
            - "^order_id$"
            - "^product_id$"
            - "^sku$"
            - "^email$"
            - "^ssn$"
            - "^tax_id$"
            - "^phone$"
            - "^account_number$"
            - "^invoice_number$"
            - "^user_id$"
            - "^national_id$"
            - "^passport_number$"
          surrogate_suffixes: ["_sk", "_key", "_surrogate", "_dim_key", "_hash"]
        non_additive_patterns:
          - "_ratio$"
          - "_rate$"
          - "_pct$"
          - "_percent$"
          - "_avg$"
          - "_average$"
          - "_mean$"
          - "_margin$"
          - "_yield$"
          - "_conversion$"

  - id: dataops-dim-sem-001
    profile: dataops
    status: active
    severity: error
    title: Fact table uses natural key joins (Kimball violation) [Semantic Fallback]
    description: >
      Evaluates SQL models for subtle Kimball violations that AST analysis
      cannot definitively confirm, such as conditional joins, dynamic column
      references, or complex subqueries where join intent requires
      architectural judgment beyond pattern matching.
    rationale: >
      Complements dataops-dim-ast-001 by covering edge cases where structural
      parsing alone produces false negatives. Skips automatically when AST
      has already confirmed the same file.
    fix: Replace natural-key joins with surrogate-key joins (customer_sk, order_sk, product_sk).
    references:
      - book: "The Data Warehouse Toolkit"
        concept: "surrogate-keys"
    checks:
      - type: semantic_eval
        # Scoped to the models/ tree so the semantic layer does not stray into
        # test-fixture SQL, migration scripts, or ad-hoc analysis files that
        # the AST layer never inspects. The AST rule stays tighter still at
        # "models/marts/facts/**/*.sql"; this wider scope catches fact-like
        # models that live outside marts/ without tripping on non-model SQL.
        file_glob: "models/**/*.sql"
        threshold: 0.60
        max_input_chars: 8000
        message: "Semantic Kimball dimensional-model review scored below threshold; fact model may use natural-key joins."

        # Option C: Defer to structural AST when it already confirmed the same file.
        # ID MUST match the structural rule above exactly (dataops-dim-ast-001).
        depends_on_rule_id: dataops-dim-ast-001
        skip_if_structural_confirmed: true

        # Deterministic preflight fallback for environments where priorFindings aren't passed.
        # If regex confirms obvious natural-key join, skip LLM entirely.
        preflight:
          enabled: true
          mode: skip_if_confirmed
          regexes:
            - 'join\s+\w+\s+(?:as\s+)?\w*\s+on\s+[^;]*\b(customer_id|order_id|product_id|sku|email|ssn)\b'
            - '\bon\s+.*=\s+.*\.(customer_id|order_id|product_id)\b'

        evaluation_prompt: |
          You are auditing a dbt SQL model for Kimball dimensional modeling violations.

          Determine whether this fact or staging model joins to another table using operational
          natural keys such as customer_id, order_id, product_id, sku, email, or ssn instead
          of surrogate keys ending in _sk, _key, _surrogate, _dim_key, or _hash.

          Important criteria:
          - A VIOLATION exists when a JOIN ON clause directly compares natural-key columns between tables.
          - A PASSING model uses surrogate keys (e.g., customer_sk = dim_customer.customer_sk).
          - Conditional joins (CASE WHEN), lateral joins, or semi-joins may still violate if they reference natural keys.
          - Subqueries that materialize natural keys before joining downstream ALSO count as violations.
          - If the model is clearly not a fact-like model (pure dimension, pure staging without joins,
            config/reference lookup), score should be HIGH (>0.85).
          - Name the SPECIFIC offending column(s) and line context in your reasoning field.
          - Do NOT flag dimensions that legitimately use natural keys as their business key unless
            they are incorrectly joined TO FROM a fact table.

          Output contract:
          Return ONLY valid JSON with this exact shape:
          {"passed": true|false, "score": 0.0-1.0, "missing": ["..."], "reasoning": "..."}

          Rules:
          - "score" must be a number between 0 and 1 representing compliance level.
          - "reasoning" MUST name the concrete violating construct (column name, join alias, subquery).
          - "missing" lists specific anti-patterns detected (e.g., ["natural-key-join-on-customer_id"]).
          - Do NOT return markdown, prose outside JSON, or explanations beyond the JSON fields.

  # ===========================================================================
  # DATAOPS LIFECYCLE HYGIENE RULES (Practical DataOps)
  # ===========================================================================

  - id: dataops-env-001
    profile: dataops
    status: active
    severity: warning
    title: Missing environment reproducibility artifacts
    description: >
      Repository lacks standardized dependency/environment specification files required
      for reproducible pipeline execution across dev/stage/prod environments.
    rationale: >
      Without pinned environments, pipeline behavior drifts silently between deployments,
      undermining trust in transformation outputs and breaking SLA guarantees.
    fix: Add requirements.txt, pyproject.toml, poetry.lock, Pipfile.lock, or conda environment.yml.
    references:
      - book: "Practical DataOps"
        concept: "environment-reproducibility"
      - book: "Fundamentals of Data Engineering"
        concept: "deployment-environments"
    checks:
      - type: file_exists
        paths:
          - "requirements.txt"
          - "pyproject.toml"
          - "poetry.lock"
          - "Pipfile.lock"
          - "environment.yml"
          - "conda-lock.yml"
        match_mode: any
        error_when: file_absent
        message: "No recognized Python environment specification file at repository root."

  - id: dataops-env-002
    profile: dataops
    status: active
    severity: info
    title: No containerized execution definition
    description: >
      Pipeline does not define Docker/Podman/Singularity image for consistent runtime isolation.
    rationale: >
      Containerization eliminates host-drift issues and enables parity between local development
      and orchestrated production execution.
    fix: Add Dockerfile or .containerignore at repository root.
    references:
      - book: "Practical DataOps"
        concept: "containerization-strategy"
    checks:
      - type: file_exists
        paths:
          - "Dockerfile"
          - "Containerfile"
          - ".dockerignore"
          - "Singularity.def"
        match_mode: any
        error_when: file_absent
        message: "No container definition file (Dockerfile, Containerfile, Singularity.def) found."

  - id: dataops-env-003
    profile: dataops
    status: active
    severity: warning
    title: No Python environment configuration detected
    description: >
      Neither PEP 621 metadata nor legacy pip/poetry/conda specifications found.
    rationale: >
      Ambiguous dependency management leads to non-reproducible installs and CI flakiness.
    fix: Standardize on one toolchain and commit its lockfile.
    references:
      - book: "Practical DataOps"
        concept: "environment-reproducibility"
    checks:
      - type: file_exists
        paths:
          - "requirements*.txt"
          - "pyproject.toml"
          - "setup.py"
          - "setup.cfg"
          - "Pipfile*"
          - "poetry.lock"
          - "environment.y*ml"
          - "conda-lock.yml"
        match_mode: any
        error_when: file_absent
        message: "No recognized Python environment spec found."

  # ===========================================================================
  # SCHEMA EVOLUTION & STREAM SAFETY RULES (Designing Data-Intensive Applications)
  # ===========================================================================

  - id: dataops-schema-001
    profile: dataops
    status: active
    severity: error
    title: Backward-incompatible schema change without migration guard
    description: >
      Detected ALTER TABLE DROP COLUMN, RENAME COLUMN, or TYPE CHANGE without corresponding
      migration script or compatibility annotation.
    rationale: >
      Unprotected destructive schema changes break downstream consumers instantly,
      violating backward-compatibility contracts essential for evolving distributed systems.
    fix: Wrap destructive DDL in reversible migrations; annotate with @compat=forward-only if intentional.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "schema-evolution-and-encoding"
      - standard: "Confluent Schema Registry Compatibility Levels"
        concept: "backward-forward-transitive-compatibility"
    checks:
      # Migrated from `scope:` + `patterns:` (list) + `exclude_if_contains:` to
      # the engine-recognized `file_glob:` + `pattern:` (string) + `error_when:`.
      # The exclude_if_contains intent (skip when @compat: backward or "-- DOWN:"
      # annotation is present) is deliberately dropped here because the current
      # engine does not support composite exclusion. It will be re-added once
      # composite checks land. Rule is now live instead of silently inert.
      - type: pattern_match
        file_glob: "migrations/**/*.{sql,py}"
        pattern: '(?i)ALTER\s+TABLE\s+\w+\s+(?:DROP\s+COLUMN|RENAME\s+COLUMN|ALTER\s+COLUMN\s+\w+\s+TYPE)'
        error_when: pattern_present
        message: "Destructive schema mutation lacks a compatibility guard."

  - id: dataops-stream-001
    profile: dataops
    status: active
    severity: error
    title: Streaming schema IDL missing
    description: >
      Kafka/Kinesis/PubSub topics referenced but no Avro (.avsc), Protobuf (.proto),
      or JSON Schema contract files accompany them.
    rationale: >
      Streaming pipelines without explicit schema contracts suffer silent corruption during
      producer/consumer version skew - the most dangerous failure mode in event-driven
      architectures.
    fix: Define event schemas with Avro/Protobuf/JSON-Schema under schemas/ and enforce compat in CI.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "schema-evolution-and-encoding"
    checks:
      # Migrated from draft `path_glob:` brace-expansion to the engine-recognized
      # `file_exists` + `paths` + `match_mode: any` shape. The native intent
      # (fire only when streaming topics are actually referenced) requires
      # `conjunctive_check` and is approximated here as "no schema IDL file exists
      # anywhere." The composite upgrade is tracked for a future engine version.
      - type: file_exists
        paths:
          - "schemas/**/*.proto"
          - "schemas/**/*.avsc"
          - "schemas/**/*.thrift"
          - "events/**/*.proto"
        match_mode: any
        error_when: file_absent
        message: "Streaming schema IDL definitions missing."

  - id: dataops-migrate-001
    profile: dataops
    status: active
    severity: warning
    title: Database migration directory missing
    description: >
      SQL DDL changes appear inline in application code or ad-hoc scripts rather than
      managed through Alembic/Flyway/Liquibase/dbmate workflow.
    rationale: >
      Hand-applied schema changes are unauditable, unreversible, and prone to drift between
      environments - directly contradicting the operational reliability principles described
      in Designing Data-Intensive Applications.
    fix: Adopt Alembic, Flyway, Liquibase, or dbmate; store ALL DDL under migrations/.
    references:
      - book: "Designing Data-Intensive Applications"
        concept: "schema-evolution"
    checks:
      # Migrated from draft `path_glob:` brace-expansion to the engine-recognized
      # `file_exists` + `paths` + `match_mode: any` shape. The `disjunctive_absence`
      # upgrade remains tracked. Rule is now live instead of silently inert.
      - type: file_exists
        paths:
          - "migrations/**"
          - "flyway/**"
          - "alembic/**"
          - "db/migrate/**"
        match_mode: any
        error_when: file_absent
        message: "Database schema migration directory missing."

  # ===========================================================================
  # PIPELINE OPERATIONAL READINESS (Cross-cutting)
  # ===========================================================================

  - id: dataops-obs-001
    profile: dataops
    status: active
    severity: warning
    title: Missing observability instrumentation
    description: >
      Transformation jobs lack structured logging, metrics emission, or trace propagation
      needed for incident triage and SLO monitoring.
    rationale: >
      Undetectable failures cascade into corrupted warehouses. Observability is prerequisite
      to trustworthy automation per DataOps lifecycle principles.
    fix: Integrate OpenTelemetry SDK or platform-native observability hooks in job entrypoints.
    references:
      - book: "Site Reliability Engineering"
        concept: "monitoring-and-alerting"
      - standard: "OpenTelemetry Specification"
        concept: "traces-metrics-logs-correlation"
    checks:
      # Migrated from `scope:` + `patterns:` (list) + `min_matches_per_file:` to
      # the engine-recognized `file_glob:` + `pattern:` (string) + `error_when:`.
      # Semantics preserved: fire when NO observability primitive appears anywhere
      # in the scanned job files. `error_when: pattern_absent` maps cleanly to the
      # old `expect_present: true` + `min_matches_per_file: 1` combination.
      - type: pattern_match
        file_glob: "**/*.{py,ts,js,scala,java}"
        pattern: '(?i)(opentelemetry|prometheus_client|statsd|structlog|logging\.getLogger|logger\.info|tracer\.start_span)'
        error_when: pattern_absent
        message: "Job files contain no recognized observability primitives."

  - id: dataops-test-001
    profile: dataops
    status: active
    severity: error
    title: Automated test suite missing
    description: >
      dbt models, Airflow DAG tasks, or notebook cells contain executable transformations
      without accompanying unit/integration tests.
    rationale: >
      Regression-free iteration demands verification at every abstraction layer.
      Untested transforms become unverifiable liabilities post-deployment.
    fix: Write dbt tests, pytest assertions, Great Expectations suites, or nbmake notebooks.
    references:
      - book: "Fundamentals of Data Engineering"
        concept: "testing-data-pipelines"
      - standard: "dbt Testing Framework"
        concept: "singular-generic-tests"
    checks:
      # Migrated from draft `path_glob:` brace-expansion to the engine-recognized
      # `file_exists` + `paths` + `match_mode: any` shape. The native intent
      # ("transformations present but no test suite") requires `conjunctive_check`
      # + `file_exists_none` and is approximated here as "no test directory exists
      # anywhere." The composite upgrade is tracked for a future engine version.
      - type: file_exists
        paths:
          - "tests/**"
          - "test/**"
          - "*_test.py"
          - "test_*.py"
          - "*.spec.ts"
        match_mode: any
        error_when: file_absent
        message: "Automated testing directory missing."

  - id: dataops-doc-001
    profile: dataops
    status: active
    severity: info
    title: Missing model/column documentation
    description: >
      dbt manifest or catalog exposes undocumented relations/columns exceeding 20% threshold.
    rationale: >
      Self-describing datasets reduce tribal knowledge risk and accelerate consumer onboarding.
    fix: Populate yml docs blocks or add COMMENT clauses to DDL statements.
    references:
      - book: "Data Management at Scale"
        concept: "metadata-as-product-contract"
    checks:
      - type: semantic_eval
        file_glob: "models/schema.yml"
        threshold: 0.75
        max_input_chars: 6000
        message: "dbt schema documentation scored below threshold (>20% undocumented)."
        evaluation_prompt: |
          Analyze this dbt schema.yml for documentation completeness.

          Count total models/columns defined vs those having description/name fields populated.
          Flag if >20% remain undocumented. In reasoning, cite specific missing elements.

          Return JSON: {"passed": bool, "score": float, "missing": [...], "reasoning": "..."}