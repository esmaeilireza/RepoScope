# docs/specs/webapp.yaml — General Web App audit rules
version: "1.0"
profile: webapp

rules:
  # ──────────────────────────────────────────────────────────────
  # Section 1 — Secrets & Credentials
  # ──────────────────────────────────────────────────────────────
  # Draft: hardcoded-secret detection is currently implemented under
  # `general-security-001` in lib/audit.ts. This webapp-scoped variant is
  # retained as a source-backed heuristic spec but is not emitted by any
  # TypeScript audit module yet. When `lib/webapp-audit.ts` gains a
  # dedicated secret check, flip this back to `status: active`.
  - id: webapp-sec-001
    profile: webapp
    severity: critical
    status: draft
    title: "Hardcoded secret or credential detected"
    rationale: >
      Committed secrets create credential leakage risk and break environment
      portability. Credentials belong in environment variables or a managed
      secret store, never in the codebase or version history. A leaked secret
      in Git history remains exploitable even after the file is deleted.
    checks:
      - type: pattern_match
        pattern: '(?i)(password|passwd|pwd|secret|api_key|apikey|access_token|private_key)\s*[:=]\s*["''][^"'']{6,}'
        must_exist: false
        file_glob: "**/*.{py,js,ts,tsx,go,java,rb,sh,yaml,yml,json,env,toml,ini}"
        error_when: "pattern_present"
        message: "Hardcoded secret or credential detected. Use environment variables or a secret manager."
    fix: |
      Replace literal secrets with environment variables or secret-store references.
      Rotate any exposed credentials and purge them from git history if needed.
    references:
      - book: "Web Application Security"
        concept: "secret-management"
      - standard: "OWASP Top 10"
        concept: "security-misconfiguration"

  # ──────────────────────────────────────────────────────────────
  # Section 2 — API Protection & Hardening
  # ──────────────────────────────────────────────────────────────
  # Active: emitted by lib/audit.ts via the `webapp-001` rule ID.
  - id: webapp-001
    profile: webapp
    severity: critical
    title: "No rate limiting on API routes"
    rationale: >
      An API without rate limiting is exposed to abuse and denial-of-service
      pressure. On serverless platforms it can also create direct cost risk. In
      reliability engineering terms, there is no protection for the shared error
      budget.
    checks:
      - type: pattern_match
        pattern: 'rateLimit|rate-limit|upstash|redis|kv'
        must_exist: true
        file_glob: "**/*.{ts,tsx,js,jsx}"
        error_when: "pattern_absent"
        message: "No rate limiting pattern found in application source files"
    fix: |
      Use @upstash/ratelimit with Vercel KV or middleware rate limiting.
    references:
      - book: "Site Reliability Engineering: How Google Runs Production Systems"
        concept: "error-budgets"
      - standard: "OWASP Top 10"
        concept: "api-abuse"

  # Active: emitted by lib/audit.ts via the `webapp-002` rule ID.
  - id: webapp-002
    profile: webapp
    severity: error
    title: "Missing Content Security Policy"
    rationale: >
      Without CSP, injected JavaScript has a larger attack surface. Hardening
      headers are a relatively cheap deployment-time control because they can be
      applied centrally without changing every application code path.
    checks:
      - type: pattern_match
        pattern: 'Content-Security-Policy|contentSecurityPolicy'
        must_exist: true
        file_glob: "**/*.{ts,tsx,js,jsx,json}"
        error_when: "pattern_absent"
        message: "No CSP header configuration found"
    fix: |
      Add the Content-Security-Policy header in next.config.js or server header configuration.
    references:
      - book: "Web Application Security"
        concept: "output-encoding"
      - book: "Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation"
        concept: "deployment-pipeline"
  - id: "webapp-csp-sem-001"
    profile: "webapp"
    severity: "error"
    title: "Content Security Policy is misconfigured"
    rationale: >
      A CSP that allows unsafe-inline, unsafe-eval, or overly broad directives
      provides no XSS protection. The policy must be evaluated for actual security.
    checks:
      - type: "semantic_eval"
        file_glob: "{next.config.*,**/security-headers.*,**/csp*.{ts,js,json}}"
        error_when: "semantic_score_below_threshold"
        threshold: 0.7
        evaluation_prompt: |
          You are a web security expert reviewing a Content Security Policy configuration.

          Evaluate each of the 5 criteria as PASS or FAIL. Do NOT use holistic
          judgement — determine each criterion independently.

          Criterion 1 — default-src:
            PASS if default-src is set to 'self', 'none', or an explicit origin
                 list that does not include the wildcard asterisk.
            FAIL if default-src is absent, set to the wildcard asterisk, or
                 includes unsafe-inline.
            NOTE: the wildcard asterisk is not an explicit origin. default-src
                  set to the wildcard asterisk = FAIL.

          Criterion 2 — script-src hardening:
            PASS if script-src is present AND does NOT contain unsafe-inline
                 or unsafe-eval.
            FAIL if script-src contains unsafe-inline or unsafe-eval.
            NOTE: a present script-src with 'self' AND unsafe-inline is FAIL —
                  unsafe-inline defeats the directive regardless of what else
                  is present.

          Criterion 3 — style-src hardening:
            PASS if style-src uses nonces or hashes.
            FAIL if style-src relies on unsafe-inline.

          Criterion 4 — object-src:
            PASS if object-src is set to 'none' exactly.
            FAIL if object-src is absent or set to anything other than 'none'.
            NOTE: absence is not protection. An absent object-src means
                  object/embed elements can load from any origin. = FAIL.

          Criterion 5 — frame-ancestors:
            PASS if frame-ancestors is present and set to 'none' or an
                 explicit origin list.
            FAIL if frame-ancestors is absent.
            NOTE: absence is not protection. An absent frame-ancestors means
                  the page is clickjackable. = FAIL.

          ── REASONING FORMAT (mandatory) ────────────────────────────────

          The reasoning field MUST be a SINGLE-LINE string containing exactly
          5 numbered verdicts separated by the pipe character. Use this exact
          shape, with no line breaks and no wrapping quotation marks:

            1. default-src: PASS or FAIL — short reason | 2. script-src: PASS or FAIL — short reason | 3. style-src: PASS or FAIL — short reason | 4. object-src: PASS or FAIL — short reason | 5. frame-ancestors: PASS or FAIL — short reason

          Two absolute rules for the reasoning string value:
            - NO literal newline characters. Everything on one line.
            - NO double-quote characters anywhere inside the reasoning value.
              To refer to a directive or token, write it bare (unsafe-inline,
              not with quotes around it). To refer to a value like self or
              none, write it bare too.

          A response whose reasoning does not fit on one line, or that
          contains a double-quote character inside the reasoning string,
          is a hard failure and will be rejected.

          ── SCORING AND MISSING[] (mechanical) ──────────────────────────

          AFTER writing the 5 verdicts in reasoning:
            1. Count how many verdicts are PASS (call it N_pass).
            2. N_fail equals 5 minus N_pass.
            3. The missing array MUST contain exactly N_fail entries, one per
               FAIL verdict. No more, no fewer.
            4. The score MUST be the midpoint value for N_pass from this table:

                 - 5 PASS: score 0.92
                 - 4 PASS: score 0.72
                 - 3 PASS: score 0.52
                 - 2 PASS: score 0.32
                 - 1 PASS: score 0.10
                 - 0 PASS: score 0.05

          CONSISTENCY CHECK: before emitting, verify that the length of the
          missing array equals N_fail, and score equals the midpoint for
          N_pass. If both are not true, redo the analysis.

          Respond with valid JSON only. The JSON object has exactly three keys:
          score (number), missing (array of strings), reasoning (single-line string).
        message: "Content Security Policy is misconfigured"
    fix: |
      Remove unsafe-inline and unsafe-eval. Set default-src to 'self', object-src to 'none'.
    references:
      - book: "Web Application Security"
        concept: "output-encoding"
      - standard: "OWASP Top 10"
        concept: "security-misconfiguration"
