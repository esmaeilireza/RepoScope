# docs/specs/cross.yaml — Cross-domain composite rules
version: "1.0"
profile: cross

rules:
  - id: cross-001
    profile: cross
    severity: error
    title: "IIoT + DataOps ABI conflict risk"
    rationale: >
      A repository mixing IIoT drivers such as pymodbus with Python data
      analytics libraries such as pandas can create silent dependency or ABI
      conflicts. The industrial driver and the data layer often have different
      stability requirements and should not unnecessarily share one dependency
      space.
    checks:
      - type: pattern_match
        pattern: "pymodbus|opcua"
        must_exist: false
        file_glob: "**/*.py"
        error_when: "pattern_present"
        message: "IIoT driver detected — check environment isolation"
    fix: |
      Use separate venv/conda environments for the IIoT drivers and the data
      layer. Each part should have its own requirements file.
    references:
      - book: "Practical DataOps"
        concept: "environment parity"
      - book: "Designing Data-Intensive Applications"
        concept: "reproducibility"

  - id: cross-002
    profile: cross
    severity: warning
    title: "IIoT control plane exposed via web API"
    rationale: >
      When web application and IIoT components coexist, PLC commands must not be
      reachable through unauthenticated API routes. The IT/OT boundary is a
      safety boundary, not only a security boundary.
    checks:
      - type: pattern_match
        pattern: "modbus|plc"
        must_exist: false
        file_glob: "app/api/**/*.ts"
        error_when: "pattern_present"
        message: "Web API route references PLC — verify authentication"
    fix: |
      API routes that reach the PLC must require authentication.
      Use network segmentation (DMZ) between the OT and IT networks.
    references:
      - book: "Industrial Network Security"
        concept: "network segmentation"
      - standard: "IEC 62443"
        concept: "zone and conduit model"