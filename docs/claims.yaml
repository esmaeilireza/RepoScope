  - id: claim-kleppmann-001
    recipient: "Martin Kleppmann"
    date: "2026-10-11"
    text: "RepoScope has a Data Architecture Gate"
    implementation: "docs/specs/dataops.yaml"
    verification:
      type: "yaml_rule_present"
      profile: "dataops"
      must_contain_rule_ids: ["dataops-004", "dataops-005", "dataops-006"]
    status: "verified"
    notes: "Rules exist. 'Gate' is aspirational — no CI blocking. Reframe."

  - id: claim-kleppmann-002
    recipient: "Martin Kleppmann"
    date: "2026-10-11"
    text: "RepoScope checks backward/forward schema compatibility"
    implementation: "docs/specs/dataops.yaml#dataops-kleppmann-002"
    verification:
      type: "rule_checks_pattern"
      rule_id: "dataops-kleppmann-002"
      expected_checks_contain: ["schema", "version"]
    status: "UNVERIFIED — run before Oct 30"
    notes: "I have not opened dataops.yaml to confirm this is true."

  - id: claim-kleppmann-003
    recipient: "Martin Kleppmann"
    date: "2026-10-11"
    text: "RepoScope checks idempotency indicators"
