# docs/claims.yaml — every technical claim made, and how to verify it
version: "1.0"

claims:
  # ── DataOps & Schema Rules ───────────────────────────────────────
  - id: claim-dataops-schema-001
    description: "RepoScope enforces schema IDL presence (Avro/Protobuf/Thrift)."
    implementation: "docs/specs/dataops.yaml"
    verification:
      type: "yaml_rule_present"
      rule_ids: ["dataops-kleppmann-002"]

  - id: claim-dataops-migrations-001
    description: "RepoScope checks for database migration tooling."
    implementation: "docs/specs/dataops.yaml"
    verification:
      type: "rule_checks_pattern"
      rule_id: "dataops-kleppmann-003"
      expected_patterns: ["migrations", "alembic", "flyway", "db/migrate"]

  - id: claim-dataops-rules-001
    description: "RepoScope ships a robust set of DataOps rules."
    implementation: "docs/specs/dataops.yaml"
    verification:
      type: "yaml_rule_count_min"
      min_count: 20

  # ── Architecture & System Rules ──────────────────────────────────
  - id: claim-total-rule-count-001
    description: "RepoScope ships exactly 47 active and draft YAML rules."
    implementation: "docs/specs/"
    verification:
      type: "total_yaml_rule_count"
      expected_count: 47

  - id: claim-checklists-001
    description: "RepoScope ships Markdown checklists generated from YAML."
    implementation: "docs/checklists/"
    verification:
      type: "files_exist"
      paths:
        - "docs/checklists/cross.md"
        - "docs/checklists/dataops.md"
        - "docs/checklists/general.md"
        - "docs/checklists/iiot.md"
        - "docs/checklists/webapp.md"

  - id: claim-cli-001
    description: "RepoScope ships a CLI to run audits from the terminal."
    implementation: "bin/reposcope"
    verification:
      type: "files_exist"
      paths:
        - "bin/reposcope"
        - "scripts/reposcope-audit.ts"