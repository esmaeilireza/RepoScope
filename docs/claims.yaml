version: "1.0"

claims:
  - id: claim-dataops-schema-001
    description: "Rule dataops-stream-001 (schema IDL enforcement) is present in the DataOps profile."
    implementation: docs/specs/dataops.yaml
    verification:
      type: yaml_rule_present
      rule_ids:
        - dataops-stream-001

  - id: claim-dataops-migrations-001
    description: "Rule dataops-migrate-001 checks for migration tooling patterns."
    implementation: docs/specs/dataops.yaml
    verification:
      type: rule_checks_pattern
      rule_id: dataops-migrate-001
      patterns:
        - migrations
        - alembic
        - flyway
        - db/migrate

  - id: claim-dataops-rules-001
    description: "The DataOps profile contains at least 20 rules."
    implementation: docs/specs/dataops.yaml
    verification:
      type: yaml_rule_count_min
      min_count: 20

  - id: claim-total-rule-count-001
    description: "Total YAML rules across all non-underscore profiles equals 58."
    implementation: docs/specs/
    verification:
      type: total_yaml_rule_count
      expected_count: 58

  - id: claim-checklists-001
    description: "All five domain checklist markdown files exist under docs/checklists/."
    implementation: docs/checklists/
    verification:
      type: files_exist
      paths:
        - docs/checklists/cross.md
        - docs/checklists/dataops.md
        - docs/checklists/general.md
        - docs/checklists/iiot.md
        - docs/checklists/webapp.md

  - id: claim-cli-001
    description: "CLI entry points bin/reposcope and scripts/reposcope-audit.ts are present."
    implementation: bin/
    verification:
      type: files_exist
      paths:
        - bin/reposcope
        - scripts/reposcope-audit.ts
